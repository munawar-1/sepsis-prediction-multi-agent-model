server:
  port: 8080

spring:
  application:
    name: aegis-clinical-core-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

aegis:
  ai-service:
    base-url: http://localhost:8000/api/v1
  dpdp:
    mask-pii: true
    hospital-name: "Apollo Multispeciality Hospitals"
