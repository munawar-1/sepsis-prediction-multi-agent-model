server:
  port: 8080

spring:
  application:
    name: aegis-clinical-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:aegis_icu;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  flyway:
    enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: aegis.icu.alerts@gmail.com
    password: ${EMAIL_APP_PASSWORD:mock_password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in ms

aegis:
  ai-service:
    base-url: http://localhost:8000/api/v1
  dpdp:
    mask-pii: true
    hospital-name: "Apollo Multispeciality Hospitals"
