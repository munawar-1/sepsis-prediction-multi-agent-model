server:
  port: 8080

spring:
  application:
    name: aegis-clinical-core
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/aegis_icu;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:openquest7@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms

aegis:
  frontend-url: ${AEGIS_FRONTEND_URL:http://localhost:3000}
  ai-service:
    base-url: http://localhost:8000/api/v1
  dpdp:
    mask-pii: true
    hospital-name: "Apollo Multispeciality Hospitals"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
